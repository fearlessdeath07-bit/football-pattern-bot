name: Run Football Minute Patterns

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'

jobs:
  run-pattern-report:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run strongest-pattern report
        run: |
          python run_today_strongest_patterns.py | tee strongest_patterns.txt

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: strongest-patterns-report
          path: strongest_patterns.txt
